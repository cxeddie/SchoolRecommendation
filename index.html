function calculateMBTI(answers) {
  const scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  answers.forEach((ans, i) => {
    const q = MBTI_QUESTIONS[i];
    if (ans === "A") {
      if (q.dim === "EI") scores.E++; else if (q.dim === "SN") scores.S++; else if (q.dim === "TF") scores.T++; else scores.J++;
    } else {
      if (q.dim === "EI") scores.I++; else if (q.dim === "SN") scores.N++; else if (q.dim === "TF") scores.F++; else scores.P++;
    }
  });
  return (scores.E >= scores.I ? "E" : "I") + (scores.S >= scores.N ? "S" : "N") + (scores.T >= scores.F ? "T" : "F") + (scores.J >= scores.P ? "J" : "P");
}

function getZodiac(year) {
  return ["鼠","牛","虎","兔","龍","蛇","馬","羊","猴","雞","狗","豬"][(year - 4) % 12];
}

function analyzeChild(child) {
  const year = new Date(child.dob).getFullYear();
  const zodiac = getZodiac(year);
  const mbti = MBTI_STYLES[child.mbti] || MBTI_STYLES["ENFP"];
  const hour = parseInt((child.birthTime || "12:00").split(":")[0]);
  let element = hour < 3 || hour >= 23 ? "水" : hour < 7 ? "木" : hour < 11 ? "火" : hour < 15 ? "土" : hour < 19 ? "金" : "水";
  return { zodiac, element, personality: `${zodiac}年生，五行偏${element}。MBTI ${child.mbti}：${mbti.desc}`, recommendedStyle: mbti.style };
}

function estimateTravel(from, to) {
  if (!from || !to || from === to) return "約 15-25 分鐘";
  const far = ["元朗","屯門","北區","大埔","西貢","離島"];
  const mid = ["沙田","荃灣","葵青","觀塘","黃大仙"];
  if (far.includes(from) && !far.includes(to)) return "約 45-70 分鐘";
  if (mid.includes(from) && far.includes(to)) return "約 40-60 分鐘";
  if (from.includes("九龍") && to.includes("港島") || from.includes("港島") && to.includes("九龍")) return "約 30-50 分鐘";
  return "約 20-40 分鐘";
}

function recommendSchools(analysis, level) {
  return (HK_SCHOOLS[level] || []).map(s => {
    let score = 68 + Math.floor(Math.random() * 15);
    if (s.style === analysis.recommendedStyle) score += 12;
    return { ...s, match: Math.min(95, score) };
  }).sort((a,b) => b.match - a.match);
}

function recommendInstitutions(analysis, avg) {
  const recs = [];
  if (!avg || avg < 75) {
    recs.push({ category: "中文加強", items: INSTITUTIONS.chinese });
    recs.push({ category: "數學加強", items: INSTITUTIONS.math });
  }
  recs.push({ category: "英文／外語", items: INSTITUTIONS.english });
  recs.push({ category: analysis.recommendedStyle === "creative" ? "創意活動" : "多元活動", items: INSTITUTIONS.activity });
  return recs;
}

function getDifficultyByGrade(grade) {
  const easy = ["未開始","PN","K1","K2","K3","P1","P2"];
  const medium = ["P3","P4"];
  if (easy.includes(grade)) return "easy";
  if (medium.includes(grade)) return "medium";
  return "hard";
}

function getNextSchoolLevel(grade) {
  if (["未開始","PN","K1","K2","K3"].includes(grade)) return "primary";
  if (["P1","P2","P3","P4","P5","P6"].includes(grade)) return "secondary";
  return "secondary";
}

function getNextLevelName(grade) {
  if (["未開始","PN","K1","K2","K3"].includes(grade)) return "小學推薦（即將升讀）";
  if (["P1","P2","P3","P4","P5","P6"].includes(grade)) return "中學推薦（即將升讀）";
  return "中學推薦";
}

function getSchoolLevel(dob) {
  if (!dob) return "primary";
  const birth = new Date(dob);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
  if (age < 6) return "kindergarten";
  if (age < 12) return "primary";
  return "secondary";
}

function getLevelName(level) {
  return level === "kindergarten" ? "幼稚園" : level === "primary" ? "小學" : "中學";
}

function getSchoolProsCons(school, analysis, radarData) {
  const labels = ["學術","創意","社交","紀律","邏輯","直覺"];
  const strong = [], weak = [];
  radarData.forEach((v, i) => {
    if (v >= 70) strong.push(labels[i]);
    else if (v <= 50) weak.push(labels[i]);
  });
  let pros = "風格匹配";
  let cons = "需適應";
  if (school.style === analysis.recommendedStyle) pros = "學習風格高度匹配";
  else if (school.style === "balanced") pros = "均衡環境，適應較易";
  if (strong.length) pros += "；優勢：" + strong.slice(0,2).join("、");
  if (weak.length) cons = "相對弱項：" + weak.slice(0,2).join("、");
  return { pros, cons };
}

function selectChild(i) { state.currentChild = state.children[i]; if (!state.currentChild.tests) state.currentChild.tests = []; state.view = "dashboard"; render(); }

function saveChild(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  state.tempChild = { 
    name: fd.get("name"), dob: fd.get("dob"), birthTime: fd.get("birthTime"), 
    gender: fd.get("gender"), grade: fd.get("grade"), district: fd.get("district") || ""
  };
  state.mbtiTest = { current: 0, answers: [] }; state.view = "mbti"; render();
}

function mbtiAnswer(ch) {
  const t = state.mbtiTest; t.answers.push(ch); t.current++;
  if (t.current >= 12) {
    const child = { ...state.tempChild, mbti: calculateMBTI(t.answers), tests: [] };
    state.children.push(child); save(); state.currentChild = child; state.view = "dashboard";
  }
  render();
}

function startTest(subject) {
  const diff = getDifficultyByGrade(state.currentChild.grade);
  state.currentTest = { subject, difficulty: diff, questions: generateQuestions(subject, diff), current: 0, correct: 0 };
  state.view = "test"; render();
}

function answer(choice) {
  const t = state.currentTest;
  if (choice === t.questions[t.current].answer) t.correct++;
  t.current++;
  if (t.current >= 15) {
    t.score = Math.round(t.correct / 15 * 100);
    if (!state.currentChild.tests) state.currentChild.tests = [];
    state.currentChild.tests.push({ subject: t.subject, score: t.score, date: new Date().toISOString() });
    const idx = state.children.findIndex(c => c.name === state.currentChild.name && c.dob === state.currentChild.dob);
    if (idx >= 0) state.children[idx] = state.currentChild;
    save(); state.view = "result";
  }
  render();
}

function analyzeItem(targetId, name, category, focus, style) {
  const c = state.currentChild;
  const an = analyzeChild(c);
  const box = document.getElementById(targetId);
  if (!box) return;
  box.classList.remove("hidden");
  box.innerHTML = "分析中...";

  const prompt = `你是香港升學顧問。請用廣東話簡潔列出「${name}」（${category}，重點：${focus}）對這個孩子的優點同缺點各 3 點。
孩子資料：${c.grade}，MBTI ${c.mbti}，學習風格${an.recommendedStyle}，居住${c.district||"未填"}。
格式：
優點：
1. ...
2. ...
3. ...
缺點：
1. ...
2. ...
3. ...
保持客觀、實用。`;

  if (state.apiKey) {
    const url = state.apiProvider === "xai" ? "https://api.x.ai/v1/chat/completions" : "https://api.openai.com/v1/chat/completions";
    const model = state.apiProvider === "xai" ? "grok-3" : "gpt-4o-mini";
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.apiKey },
      body: JSON.stringify({ model, messages: [{ role: "user", content: prompt }], temperature: 0.6 })
    }).then(r => r.json()).then(d => {
      box.innerHTML = (d.choices?.[0]?.message?.content || "無回應").replace(/\n/g, "<br>");
    }).catch(() => {
      box.innerHTML = localProsCons(name, style || focus, an);
    });
  } else {
    box.innerHTML = localProsCons(name, style || focus, an);
  }
}

function localProsCons(name, style, an) {
  const match = style === an.recommendedStyle ? "風格匹配度高" : "風格有差異";
  return `<b>優點：</b><br>1. ${match}，可能較適合孩子學習節奏<br>2. 提供結構化課程／活動<br>3. 有助建立相關能力<br><br><b>缺點：</b><br>1. 需考慮通勤時間<br>2. 競爭或壓力可能較高<br>3. 費用同時間投入需評估<br><span class="text-gray-400">（本地簡易分析，建議配合 API 取得更詳細內容）</span>`;
}

function getRadarData(child, analysis, avg) {
  const mbti = child.mbti || "ENFP";
  const e = mbti[0] === "E" ? 80 : 45;
  const n = mbti[1] === "N" ? 75 : 50;
  const t = mbti[2] === "T" ? 78 : 48;
  const j = mbti[3] === "J" ? 82 : 42;
  const academic = avg !== null ? Math.min(95, avg) : 60;
  const creative = analysis.recommendedStyle === "creative" || analysis.recommendedStyle === "inquiry" ? 85 : 55;
  return [academic, creative, e, j, t, n];
}

function renderRadar() {
  const c = state.currentChild;
  if (!c) return;
  const an = analyzeChild(c);
  const avg = c.tests?.length ? Math.round(c.tests.reduce((s,t)=>s+t.score,0)/c.tests.length) : null;
  const data = getRadarData(c, an, avg);
  const labels = ["學術", "創意", "社交", "紀律", "邏輯", "直覺"];
  const container = document.getElementById("radar-container");
  if (!container) return;

  const size = 220, cx = 110, cy = 110, maxR = 80;
  const points = data.map((v, i) => {
    const angle = (Math.PI * 2 * i / 6) - Math.PI / 2;
    const r = (v / 100) * maxR;
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  });
  const poly = points.map(p => p.join(",")).join(" ");

  let axes = "";
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI * 2 * i / 6) - Math.PI / 2;
    const x2 = cx + maxR * Math.cos(angle);
    const y2 = cy + maxR * Math.sin(angle);
    const lx = cx + (maxR + 18) * Math.cos(angle);
    const ly = cy + (maxR + 18) * Math.sin(angle);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#e5e7eb" stroke-width="1"/>`;
    axes += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#6b7280">${labels[i]}</text>`;
  }

  container.innerHTML = `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <polygon points="${[0,1,2,3,4,5].map(i=>{
        const a = (Math.PI*2*i/6)-Math.PI/2;
        return (cx+maxR*Math.cos(a))+","+(cy+maxR*Math.sin(a));
      }).join(" ")}" fill="none" stroke="#e5e7eb" stroke-width="1"/>
      ${axes}
      <polygon points="${poly}" fill="rgba(99,102,241,0.25)" stroke="rgb(99,102,241)" stroke-width="2"/>
      ${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="rgb(99,102,241)"/>`).join("")}
    </svg>`;
}

function showMBTIDetail() {
  const c = state.currentChild;
  const d = MBTI_DETAILS[c.mbti] || MBTI_DETAILS["ENFP"];
  const box = document.getElementById("mbti-detail");
  box.classList.remove("hidden");
  box.innerHTML = `<b>${c.mbti} · ${d.name}</b><br><br>
    <b>學習風格：</b>${d.learning}<br>
    <b>適合學校方向：</b>${d.school}<br>
    <b>家長注意：</b>${d.tip}`;
  box.scrollIntoView({ behavior: "smooth" });
}

function showAIAnalysis() {
  const c = state.currentChild, an = analyzeChild(c);
  const avg = c.tests?.length ? Math.round(c.tests.reduce((s,t)=>s+t.score,0)/c.tests.length) : null;
  const home = c.district || "未填寫";
  const box = document.getElementById("ai-result"); box.classList.remove("hidden"); box.innerHTML = "分析中...";
  if (state.apiKey) {
    const prompt = `你是香港升學顧問。請用廣東話為家長寫一份較詳細分析（400-600字），涵蓋：1.性格與學習特點 2.能力評估 3.學校建議（考慮居住${home}） 4.補習方向 5.實務建議。孩子：${c.name}，${c.grade}，MBTI ${c.mbti}，平均${avg||"無"}。`;
    const url = state.apiProvider === "xai" ? "https://api.x.ai/v1/chat/completions" : "https://api.openai.com/v1/chat/completions";
    const model = state.apiProvider === "xai" ? "grok-3" : "gpt-4o-mini";
    fetch(url, { method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+state.apiKey}, body:JSON.stringify({model, messages:[{role:"user",content:prompt}]}) })
      .then(r=>r.json()).then(d=>box.innerHTML=(d.choices?.[0]?.message?.content||"無回應").replace(/\n/g,"<br>"))
      .catch(()=>box.innerHTML=localAnalysis(c, an, avg, home));
  } else box.innerHTML = localAnalysis(c, an, avg, home);
}

function localAnalysis(c, an, avg, home) {
  return `<b>綜合分析</b><br>${an.personality}<br><br><b>能力：</b>${avg?"平均"+avg+"分":"未有數據"}。<br><b>學校：</b>優先匹配「${an.recommendedStyle}」風格，考慮${home}通勤。<br><b>補習：</b>按弱項加強，避免過度。<br><b>提示：</b>多參觀學校親身感受。`;
}

render();
</script>
